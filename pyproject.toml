[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe-detection"
version = "1.0.0"
description = "Detection d'equipements de protection individuelle (EPI) basee sur Ultralytics YOLO"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "PPE Detection Project" }]

dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3,<9",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
ui = ["streamlit>=1.35"]
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxslim>=0.1.59"]
audit = ["imagehash>=4.3", "seaborn>=0.13"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
ppe-audit = "ppe_detection.dataset_audit:main"
ppe-clean = "ppe_detection.dataset_cleaner:main"
ppe-train = "ppe_detection.train:main"
ppe-evaluate = "ppe_detection.evaluate:main"
ppe-predict = "ppe_detection.predict:main"
ppe-export = "ppe_detection.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "artifacts", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RET", "ARG", "N"]
ignore = [
    "B008",   # FastAPI Depends/File defaults in signatures are idiomatic
    "N806",   # allow ML-conventional local names
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that load a real model or run inference",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
files = ["src/ppe_detection"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
